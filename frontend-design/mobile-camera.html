<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Pacer — Mobile Camera Concept</title>
  <style>
    :root {
      --bg: #eef6ee;
      --panel: #f8fbf8;
      --card: #ffffff;
      --text: #183a2c;
      --muted: #617a6a;
      --primary: #5dbb76;
      --primary-strong: #2c9c5a;
      --primary-soft: #dff4e5;
      --danger: #de715e;
      --danger-soft: #ffe9e3;
      --amber: #d9a35d;
      --amber-soft: #fdf1dc;
      --border: rgba(24,58,44,0.12);
      --shadow: 0 18px 42px rgba(50, 94, 63, 0.12);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: "Segoe UI", sans-serif; background: linear-gradient(180deg, #edf6ef, #f7fbf7); color: var(--text); }
    body { padding: 24px; }
    .page { max-width: 1180px; margin: 0 auto; }
    .topnav {
      display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 22px;
    }
    .nav-btn {
      text-decoration: none; padding: 8px 14px; border-radius: 12px; border: 1px solid var(--border);
      background: rgba(255,255,255,0.65); color: var(--text); font-size: 11px; font-weight: 800;
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    .nav-btn.active { background: linear-gradient(135deg, var(--primary), var(--primary-strong)); border: none; color: white; }

    .phone-shell {
      width: min(420px, 100%); margin: 0 auto; background: rgba(255,255,255,0.7); border-radius: 32px;
      border: 1px solid rgba(255,255,255,0.7); box-shadow: var(--shadow); overflow: hidden;
    }
    .phone-header {
      background: rgba(255,255,255,0.8); border-bottom: 1px solid var(--border); padding: 18px 18px 12px;
    }
    .statusbar {
      display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--muted);
    }
    .camera-lens { width: 8px; height: 8px; border-radius: 50%; background: var(--primary-strong); box-shadow: 0 0 12px rgba(44,156,90,0.8); }
    .brand-row { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; }
    .logo { width: 28px; height: 28px; border-radius: 10px; background: linear-gradient(135deg, #a9e0b7, #60c57f); }
    .settings { font-size: 16px; }

    .camera-panel {
      padding: 16px; background: linear-gradient(180deg, #edf6ef, #f7fbf7);
    }
    .stage {
      position: relative; height: 420px; border-radius: 24px; background: linear-gradient(180deg, rgba(133, 204, 155, 0.18), rgba(255,255,255,0.4));
      border: 1px solid var(--border); overflow: hidden;
    }
    .stage::before {
      content: ""; position: absolute; inset: 0; background-image:
        linear-gradient(rgba(255,255,255,0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.15) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .label-box {
      position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); width: 70%; height: 58%; border-radius: 24px;
      border: 2px solid rgba(77, 176, 105, 0.9); background: rgba(255,255,255,0.08);
    }
    .label-box::before, .label-box::after {
      content: ""; position: absolute; width: 24px; height: 24px; border-color: rgba(77,176,105,0.9); border-style: solid;
    }
    .label-box::before { left: 12px; top: 12px; border-width: 3px 0 0 3px; border-top-left-radius: 10px; }
    .label-box::after { right: 12px; bottom: 12px; border-width: 0 3px 3px 0; border-bottom-right-radius: 10px; }
    .tag { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--border); font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--primary-strong); }
    .scan-line {
      position: absolute; left: 16px; right: 16px; top: 50%; transform: translateY(-50%); height: 2px; background: linear-gradient(90deg, transparent, rgba(86,182,106,0.8), transparent);
      box-shadow: 0 0 18px rgba(86,182,106,0.7);
    }
    .scan-cards {
      position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; justify-content: space-between; gap: 10px;
    }
    .scan-pill {
      display: inline-flex; align-items: center; justify-content: center; min-height: 30px; padding: 0 10px;
      border-radius: 12px; background: rgba(255,255,255,0.76); border: 1px solid var(--border); font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
    }
    .scan-pill.warn { color: var(--danger); }

    .results {
      margin-top: 16px; background: rgba(255,255,255,0.75); border: 1px solid var(--border); border-radius: 22px; padding: 16px;
    }
    .results-head {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
    }
    .results-head h3 { margin: 0; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .score {
      padding: 6px 10px; border-radius: 999px; background: var(--primary-soft); color: var(--primary-strong);
      font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
    }
    .row {
      display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid rgba(24,58,44,0.08);
    }
    .row:first-of-type { border-top: none; }
    .label { color: var(--muted); font-size: 11px; font-weight: 700; }
    .value { font-size: 12px; font-weight: 800; }
    .cta-row { display: flex; gap: 10px; margin-top: 16px; }
    .cta-row button {
      flex: 1; border: none; border-radius: 14px; min-height: 42px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em;
    }
    .primary { background: linear-gradient(135deg, var(--primary), var(--primary-strong)); color: white; }
    .secondary { background: rgba(255,255,255,0.8); border: 1px solid var(--border); color: var(--text); }
  </style>
</head>
<body>
  <div class="page">
    <div class="topnav">
      <a class="nav-btn" href="ui frontend.html">Desktop</a>
      <a class="nav-btn active" href="mobile-camera.html">Mobile</a>
      <a class="nav-btn" href="consumer-safety.html">Safety</a>
      <a class="nav-btn" href="command-center.html">Ops</a>
    </div>

    <div class="phone-shell">
      <div class="phone-header">
        <div class="statusbar">
          <span>9:41</span>
          <span class="camera-lens"></span>
        </div>
        <div class="brand-row">
          <div class="brand">
            <div class="logo"></div>
            <span>Food Pacer</span>
          </div>
          <div class="settings">⋯</div>
        </div>
      </div>

      <div class="camera-panel">
        <div class="stage">
          <div class="tag">Live Scan</div>
          <div class="label-box"></div>
          <div class="scan-line"></div>
          <div class="scan-cards">
            <div class="scan-pill">MRP: ₹299</div>
            <div class="scan-pill warn">Expiry Missing</div>
          </div>
        </div>

        <div class="results">
          <div class="results-head">
            <h3>Review Summary</h3>
            <span class="score">High Confidence</span>
          </div>

          <div class="row">
            <span class="label">Detected</span>
            <span class="value">MRP, Batch</span>
          </div>
          <div class="row">
            <span class="label">Risk</span>
            <span class="value">Low</span>
          </div>
          <div class="row">
            <span class="label">Action</span>
            <span class="value">Approve</span>
          </div>
        </div>

        <div class="cta-row">
          <button class="secondary">Recapture</button>
          <button class="primary">Continue</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
